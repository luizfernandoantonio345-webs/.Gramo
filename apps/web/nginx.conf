server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API no mesmo host: encaminha /api/* para o servico da API.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA (SPA): fallback para index.html.
    location / {
        try_files $uri $uri/ /index.html;

        # --- Headers de seguranca (produzem-se so no HTML da SPA) -------------
        # Ajustados ao que o app REALMENTE precisa. Se algo quebrar apos o
        # deploy, o console do navegador mostra a violacao de CSP -- afrouxe a
        # diretiva especifica. Ainda NAO testado em dev (dev usa vite preview,
        # nao nginx); valide no primeiro deploy.
        #
        # style-src 'unsafe-inline': o app usa muitos estilos inline + o Leaflet
        #   injeta estilos. script-src 'wasm-unsafe-eval': o face-api (TensorFlow)
        #   pode usar WASM. img-src inclui os tiles do OpenStreetMap (mapa das
        #   obras) + data:/blob: (fotos, PDFs, downloads). connect-src 'self':
        #   API no mesmo host (proxy /api) e modelos faciais em /models.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # A camera e a geolocalizacao (batida de ponto) so para a propria origem.
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    }

    # Cache de assets com hash; nao cachear o index/manifest/sw.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
