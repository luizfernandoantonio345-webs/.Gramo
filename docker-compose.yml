# =============================================================================
# REP-P - Ambiente local (app + postgres) subindo com um comando:
#   docker compose up -d
# Requer um arquivo .env na raiz (copie de .env.example).
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: repp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumida pelo script de init para criar a role da app (repp_app).
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - repp_pgdata:/var/lib/postgresql/data
      # Cria a role repp_app (NOSUPERUSER) na primeira inicializacao.
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: repp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Carrega TODOS os segredos do .env (JWT, DATA_ENCRYPTION_KEY, SUPER_ADMIN_*,
    # SUPER_DATABASE_URL exige role repp_super em producao, CORS_ORIGINS, STORAGE_*,
    # SMTP_*, TTLs, ASSINATURA_SEED). Sem isso a API nao sobe em producao.
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      # Overrides das conexoes: dentro da rede do compose o host do banco e
      # "postgres" (o .env usa localhost, que apontaria para o proprio container).
      DATABASE_URL: postgresql://repp_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SUPER_DATABASE_URL: postgresql://repp_super:${POSTGRES_SUPER_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Sem "?schema=public": esta URL tambem alimenta o `psql` do db:rls, e o
      # libpq rejeita o parametro "schema" (erro: invalid URI query parameter).
      # O Prisma usa o schema public por padrao, entao nada muda para ele.
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Persiste os arquivos do STORAGE_DRIVER=local (fotos/biometria e documentos --
    # dado sensivel com guarda legal). Sem isto, seriam perdidos ao recriar o
    # container. WORKDIR e /repo/apps/api e STORAGE_LOCAL_PATH e ./storage.
    volumes:
      - repp_storage:/repo/apps/api/storage
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: repp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  repp_pgdata:
  repp_storage:
