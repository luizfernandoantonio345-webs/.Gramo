name: CI

on:
  push:
    # fase-b-estabilizacao e o branch de deploy em producao: validar todo push.
    branches: [main, master, fase-b-estabilizacao]
  pull_request:

# Cancela execucoes antigas do mesmo ref (economia de minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate -w @repp/api

      - name: Build (shared -> api -> web)
        run: |
          npm run build -w @repp/shared
          npm run build -w @repp/api
          npm run build -w @repp/web

      - name: Lint
        run: npm run lint

      - name: Checagem de formatacao
        run: npm run format:check

      - name: Testes (unidade)
        run: npm test

      - name: Validar schema Prisma
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      # e2e com Postgres real embarcado (RLS, concorrencia do NSR, imutabilidade).
      - name: Testes e2e (Postgres embarcado)
        run: npm run test:e2e -w @repp/api

      # e2e de FLUXO: sobe PG embarcado + seed + a API HTTP real e exercita
      # login (admin+funcionario) -> dashboard -> bater ponto (backend real).
      - name: Testes e2e de fluxo (API real, Postgres embarcado)
        run: npm run test:e2e:fluxo -w @repp/api

      # E2E de UI (fumaca das telas): o Playwright sobe o `vite preview` do build
      # e verifica que as telas renderizam (trava regressao de "tela branca").
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes E2E de UI (Playwright)
        run: npm run test:e2e -w @repp/web
      - name: Publicar relatorio do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # SCA: trava regressao de vulnerabilidade ALTA/CRITICA em dependencia de
      # PRODUCAO (dev-tooling nao entra). Hoje prod = 0 vulnerabilidades.
      - name: Auditoria de dependencias (producao)
        run: npm audit --omit=dev --audit-level=high
