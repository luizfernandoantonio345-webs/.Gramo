name: CI

on:
  push:
    # fase-b-estabilizacao e o branch de deploy em producao: validar todo push.
    branches: [main, master, fase-b-estabilizacao]
  pull_request:

# Cancela execucoes antigas do mesmo ref (economia de minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate -w @repp/api

      - name: Build (shared -> api -> web)
        run: |
          npm run build -w @repp/shared
          npm run build -w @repp/api
          npm run build -w @repp/web

      - name: Lint
        run: npm run lint

      - name: Checagem de formatacao
        run: npm run format:check

      - name: Testes (unidade)
        run: npm test

      - name: Validar schema Prisma
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      # e2e com Postgres real embarcado (RLS, concorrencia do NSR, imutabilidade).
      - name: Testes e2e (Postgres embarcado)
        run: npm run test:e2e -w @repp/api

      # SCA: trava regressao de vulnerabilidade ALTA/CRITICA em dependencia de
      # PRODUCAO (dev-tooling nao entra). Hoje prod = 0 vulnerabilidades.
      - name: Auditoria de dependencias (producao)
        run: npm audit --omit=dev --audit-level=high
